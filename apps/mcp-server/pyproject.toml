[project]
name = "opspilot-mcp-server"
version = "0.1.0"
description = "OpsPilot MCP Server - Tool Server for Agent"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
