[project]
name = "opspilot-backend"
version = "0.1.0"
description = "OpsPilot Backend - FastAPI + LangGraph Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    # `Settings` declares env_file=".env"; pydantic-settings reads that file
    # through python-dotenv. Undeclared before, so whether `.env` was honoured
    # at all depended on which packages happened to pull it in.
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    # The asyncio extra carries greenlet, which SQLAlchemy's async engine
    # imports eagerly. Without it the app dies at import with "No module named
    # 'greenlet'" on any clean install — locally it was only present transitively.
    "sqlalchemy[asyncio]>=2.0.0",
    # SQLite is the runtime store — aiosqlite is the async driver SQLAlchemy
    # needs for it. It was previously undeclared and only present by accident.
    "aiosqlite>=0.20.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
