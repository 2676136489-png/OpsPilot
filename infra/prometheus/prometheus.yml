# =============================================================================
# Prometheus - Phase 0 Skeleton
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'opspilot-backend'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'

  - job_name: 'opspilot-simulator'
    static_configs:
      - targets: ['localhost:9000']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['localhost:8889']
